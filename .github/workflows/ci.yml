name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [18, 20, 22] }   # package.json says Node >= 18.17, so we test the oldest and newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm test
        working-directory: server
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run data:validate
        if: ${{ hashFiles('data-pipeline/robots/*.json') != '' }}
      - run: npm ci || npm install
      - run: npm run check
      - run: npm run build
